<text x="92.0" y="210.0" fill="#e8edf3" font-size="14" text-anchor="start">2.5 m structural roof / earth</text>
<text x="92.0" y="259.0" fill="#80c8ed" font-size="14" text-anchor="start">CEILING UNDERSIDE y5.5</text>
<text x="92.0" y="333.0" fill="#e8edf3" font-size="16" text-anchor="start">B6: 28 m clear room width</text>
<text x="92.0" y="358.0" fill="#e8edf3" font-size="14" text-anchor="start">Standing headroom: 5.5 m</text>
<text x="92.0" y="394.0" fill="#80c8ed" font-size="14" text-anchor="start">BASEMENT FLOOR y0</text>
<text x="690.0" y="118.0" fill="#e8edf3" font-size="18" text-anchor="start">R7b / X ROAD — RIDGE SERVICE BRIDGE</text>
<rect x="710" y="165" width="490" height="52" fill="#608469"/><rect x="710" y="217" width="32" height="183" fill="#786650"/><rect x="1168" y="217" width="32" height="183" fill="#786650"/><rect x="710" y="400" width="490" height="14" fill="#786650"/>
<text x="755.0" y="156.0" fill="#81cc9a" font-size="14" text-anchor="start">RIDGE DECK y16</text>
<text x="755.0" y="245.0" fill="#e8edf3" font-size="14" text-anchor="start">UNDERSIDE y14</text>
<text x="755.0" y="300.0" fill="#e8edf3" font-size="16" text-anchor="start">6 m clear above tank road</text>
<text x="755.0" y="330.0" fill="#e8edf3" font-size="14" text-anchor="start">12 m carriageway below</text>
<text x="755.0" y="389.0" fill="#eb947b" font-size="14" text-anchor="start">TANK ROAD y8</text>
<text x="40.0" y="472.0" fill="#e8edf3" font-size="18" text-anchor="start">B0 → B1 / TWO 20-RISER FLIGHTS</text>
