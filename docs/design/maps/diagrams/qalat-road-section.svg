<text x="65.0" y="532.0" fill="#e8edf3" font-size="14" text-anchor="start">y8 / loading vestibule</text>
<text x="315.0" y="548.0" fill="#e8edf3" font-size="14" text-anchor="start">20 risers</text>
<text x="454.0" y="593.0" fill="#e8edf3" font-size="14" text-anchor="start">y4 / switchback landing</text>
<text x="674.0" y="604.0" fill="#e8edf3" font-size="14" text-anchor="start">20 risers</text>
<text x="820.0" y="655.0" fill="#e8edf3" font-size="14" text-anchor="start">y0 / stair foot</text>
<text x="65.0" y="702.0" fill="#e8edf3" font-size="14" text-anchor="start">Each flight: 0.20 m rise × 0.40 m tread, 4 m clear width, intermediate landing, ≥3.2 m headroom.</text>
<text x="65.0" y="730.0" fill="#a9b9c8" font-size="14" text-anchor="start">Illustration unfolds the switchback. Follow the exact x/z vertices in the room table; never cut through a slab.</text>
