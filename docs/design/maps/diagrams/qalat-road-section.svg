<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img"><title>Qalat Road vertical construction sections</title><desc>Road above basement, ridge above tank road, and two-flight basement descent. Dimensions control construction.</desc><rect width="1300" height="760" fill="#111d2a"/><g font-family="Arial, sans-serif">
<text x="40.0" y="42.0" fill="#e8edf3" font-size="26" text-anchor="start">THE QALAT ROAD / VERTICAL SECTIONS</text>
<text x="40.0" y="69.0" fill="#a9b9c8" font-size="14" text-anchor="start">Schematic sections · not to a common scale · all y values are world heights in metres</text>
<text x="40.0" y="118.0" fill="#e8edf3" font-size="18" text-anchor="start">A6 / B6 — ROAD OVER GREAT VAULT</text>
<rect x="60" y="165" width="510" height="75" fill="#786650"/><rect x="60" y="240" width="22" height="160" fill="#786650"/><rect x="548" y="240" width="22" height="160" fill="#786650"/><rect x="60" y="400" width="510" height="14" fill="#41637b"/>
