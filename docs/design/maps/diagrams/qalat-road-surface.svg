<text x="40.0" y="493.0" fill="#eb947b" font-size="13" text-anchor="start">TANK SERVICE INGRESS</text>
<text x="40.0" y="518.0" fill="#a9b9c8" font-size="13" text-anchor="start">Separate y8 road; passes below ridge</text>
<text x="40.0" y="562.0" fill="#a9b9c8" font-size="13" text-anchor="start">Red circles: hostile group size</text>
<text x="40.0" y="587.0" fill="#a9b9c8" font-size="13" text-anchor="start">Dotted green: support sight line</text>
