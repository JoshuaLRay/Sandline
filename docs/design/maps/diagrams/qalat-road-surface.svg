<text x="865.0" y="164.0" fill="#a9b9c8" font-size="13" text-anchor="start">Three infantry gates; courtyard convergence</text>
<text x="865.0" y="210.0" fill="#e8edf3" font-size="16" text-anchor="start">RIDGE BRIDGE / y16</text>
<text x="865.0" y="234.0" fill="#a9b9c8" font-size="13" text-anchor="start">Tank road passes beneath at y8</text>
<text x="865.0" y="254.0" fill="#a9b9c8" font-size="13" text-anchor="start">No movement link at the crossing</text>
<text x="865.0" y="350.0" fill="#e8edf3" font-size="16" text-anchor="start">V3 / SURVEY POST</text>
<text x="865.0" y="374.0" fill="#a9b9c8" font-size="13" text-anchor="start">Supports final road approach</text>
<text x="865.0" y="394.0" fill="#a9b9c8" font-size="13" text-anchor="start">Prisoner room remains screened</text>
<text x="865.0" y="500.0" fill="#e8edf3" font-size="16" text-anchor="start">V2 / EAGLE SHELF</text>
<text x="865.0" y="524.0" fill="#a9b9c8" font-size="13" text-anchor="start">Supports depot frontage + upper stair</text>
<text x="865.0" y="544.0" fill="#a9b9c8" font-size="13" text-anchor="start">C12-U is the only upper road link</text>
<text x="865.0" y="700.0" fill="#e8edf3" font-size="16" text-anchor="start">V1 / LOWER SADDLE</text>
<text x="865.0" y="724.0" fill="#a9b9c8" font-size="13" text-anchor="start">Supports the first road fight</text>
<text x="865.0" y="744.0" fill="#a9b9c8" font-size="13" text-anchor="start">C12-L is the only lower road link</text>
<text x="865.0" y="860.0" fill="#e8edf3" font-size="16" text-anchor="start">D0 / ROUTE CHOICE</text>
<text x="865.0" y="884.0" fill="#a9b9c8" font-size="13" text-anchor="start">Road north · ridge east · basement west</text>
<text x="865.0" y="904.0" fill="#a9b9c8" font-size="13" text-anchor="start">No enemy in the decision court</text>
<text x="865.0" y="980.0" fill="#e8edf3" font-size="16" text-anchor="start">S0 / JUNIPER HOLLOW</text>
<text x="865.0" y="1004.0" fill="#a9b9c8" font-size="13" text-anchor="start">Spawn + extraction behind two rock folds</text>
<text x="865.0" y="1024.0" fill="#a9b9c8" font-size="13" text-anchor="start">No enemy route has line of sight inside</text>
