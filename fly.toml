# One deployed session host (T-1.5.07). See docs/DEPLOYING.md.
#
# Fly terminates TLS at its edge and forwards the WebSocket to the container's
# plain ws:// port, which is exactly the arrangement the Dockerfile expects —
# the public address is wss://<app>.fly.dev and the process never sees a
# certificate. One region, one machine, no orchestration: E-4.9 stays in E-4.9.
#
# `app` and `primary_region` are the two lines to change for a fresh deploy:
# app names are global on Fly, and the region should be near the people playing.

app = "sandline-host"
primary_region = "iad"

[build]
  dockerfile = "packages/server/Dockerfile"

[env]
  PORT = "8080"
  LOG_LEVEL = "info"
  # T-4.23: campaign progress and the durable player directory share this SQLite
  # file. /data is the Fly volume below; WAL keeps acknowledged saves atomic.
  CAMPAIGN_DB_PATH = "/data/sandline.sqlite"
  # R12: caps, and small ones. Four rooms is 24 players on one shared-cpu-1x
  # machine, far more than a playtest needs and far fewer than a stranger who
  # finds the address could do anything with.
  MAX_ROOMS = "4"
  ROOM_GRACE_MS = "120000"
  # A socket held open keeps the machine from stopping itself, so nobody may
  # hold one forever: drop a player after 10 idle minutes, and anyone after
  # 4 hours. These are also the defaults; they are written here so a change is
  # a reviewed diff. The join key is NOT here: it is a secret
  # (`fly secrets set JOIN_KEY=…`, DEPLOYING.md), because this file is public.
  IDLE_TIMEOUT_MS = "600000"
  MAX_SESSION_MS = "14400000"
  # The QA host runs the AI (T-3.35 follow-up): rooms get their world's
  # navmesh and cover, friendly bots that follow, fight and take orders, and
  # the mission on a world that has one — so a QA run needs nobody's laptop.
  # AI_DEBUG lets a tester press B for the brains' overlay; it shows the
  # enemies' reasoning to anyone in the room, which is what a QA host is for.
  HOST_AI = "1"
  AI_DEBUG = "1"

[mounts]
  source = "sandline_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Between playtests the machine STOPS ITSELF once no socket is open, and
  # starts again on the next connection — a cold start costs the first player
  # a few seconds and costs the project nothing while nobody is playing. That
  # is R12's "take it down between playtests", automated. `fly scale count 0`
  # (DEPLOYING.md) is the manual version, for when it should stay down.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # Six per room, four rooms, plus handshakes in flight. Beyond this Fly queues
  # rather than the host degrading, which is the wrong failure but a bounded one.
  [http_service.concurrency]
    type = "connections"
    hard_limit = 40
    soft_limit = 32

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# T-4.33: Fly's managed Prometheus scrapes this into the org's metrics; the
# dashboard and the alert rules for it are in docs/observability/.
[metrics]
  port = 8080
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
