name: CI

# A pull request's branch used to run this whole workflow twice for every push (once for `push`, once for
# `pull_request`), eight jobs where four do. The pull-request run is the one that counts (it tests the branch merged
# into its base), so `push` is now only main, and a newer push to the same pull request replaces the run in flight.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json's `packageManager` field is
      # the single source of truth; specifying both makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # T-4.03: ADR-013's budgets, every asset's numbers against its class,
      # printed so an overrun names the asset in the job log. `pnpm verify`
      # already fails on one; this is the readable line.
      - run: pnpm check:assets
      # T-4.06: the initial pack, not every level asset, owns the 80 MB ceiling.
      - run: pnpm check:packs

  # T-4.06: a real Chromium page over a throttled 4 Mbit/s link must reach its
  # first rendered mission frame inside ADR-013's 30 second ceiling.
  streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      # The browser download is most of this job's time and the slowest, flakiest step in CI: cache it by Playwright's
      # version, and retry (with a time limit) the one download that stalls.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browsers' system libraries come from an Ubuntu mirror that is sometimes very slow (a package every few
      # seconds; fifteen minutes for three browsers): keep the .debs apt downloads and put them back before the install.
      - id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-streaming-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Seed apt with the cached packages
        run: |
          mkdir -p ~/apt-debs
          sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed or timed out" >&2
            # A timed-out attempt leaves its apt-get running; a retry needs the dpkg lock it holds.
            for _ in $(seq 60); do sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break; sleep 5; done
          done
          exit 1
      - name: Keep the downloaded packages
        if: always() && steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-debs
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo chown -R "$USER" ~/apt-debs
      - name: Save the downloaded packages
        if: always() && steps.debs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-streaming-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm check:packs
      - run: pnpm --filter @sandline/client build
      - run: pnpm check:load-time
      - name: Qalat Road first playable frame budget
        run: SANDLINE_LOAD_WORLD=qalat-road pnpm check:load-time
      # T-5.04: the slice mission with the squad, walked and fought; asserts the draw budget, records frame time.
      - name: Capture Qalat map review
        run: pnpm exec tsx packages/tools/src/capture-map-review.ts
      - uses: actions/upload-artifact@v4
        with:
          name: qalat-map-review
          path: artifacts/map-review/*
          if-no-files-found: error
      - name: Generate and capture isolated Juniper Hollow construction
        run: |
          pnpm gen:qalat-insertion
          pnpm exec tsx packages/tools/src/capture-qalat-insertion.ts
      - uses: actions/upload-artifact@v4
        with:
          name: qalat-insertion-review
          path: artifacts/qalat-insertion/*
          if-no-files-found: error
      - name: Generate and capture isolated Qalat road supports
        run: |
          pnpm gen:qalat-road-supports
          pnpm exec tsx packages/tools/src/capture-qalat-road-supports.ts
      - uses: actions/upload-artifact@v4
        with:
          name: qalat-road-support-review
          path: artifacts/qalat-road-supports/*
          if-no-files-found: error
      - run: pnpm perf:frame

  # ADR-014: the transcendental-drift bug is invisible on a V8-to-V8 pairing.
  # Node and Chrome are both V8, so parity MUST also run on a non-V8 engine or
  # nothing in this project can detect it.
  parity-non-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json's `packageManager` field is
      # the single source of truth; specifying both makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium for T-3.01's navmesh run; the ADR-014 parity project still
      # runs on Firefox and WebKit only.
      #
      # Three browsers downloaded and their system libraries installed, every run, took 6 minutes to over half an hour
      # (the parity test itself takes 15 seconds), and sometimes stalled for good. The browsers are cached by
      # Playwright's version, and the install is retried with a time limit.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-parity-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browsers' system libraries come from an Ubuntu mirror that is sometimes very slow (a package every few
      # seconds; fifteen minutes for three browsers): keep the .debs apt downloads and put them back before the install.
      - id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-parity-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Seed apt with the cached packages
        run: |
          mkdir -p ~/apt-debs
          sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
      - name: Install browsers
        run: |
          for attempt in 1 2 3; do
            timeout 300 pnpm exec playwright install --with-deps chromium firefox webkit && exit 0
            echo "playwright install attempt $attempt failed or timed out" >&2
            # A timed-out attempt leaves its apt-get running; a retry needs the dpkg lock it holds.
            for _ in $(seq 60); do sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break; sleep 5; done
          done
          exit 1
      - name: Keep the downloaded packages
        if: always() && steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-debs
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo chown -R "$USER" ~/apt-debs
      - name: Save the downloaded packages
        if: always() && steps.debs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-parity-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm test:parity-browsers

  # T-4.17: discover every committed mission file; three seeds at both budgets.
  # Each mission completes at least once, or reports why (gameplay losses are
  # diagnostic; invalid files and runner errors fail). See known balance bug B-11.
  # Keep T-3.35's combat/AI-cost gate as a separate step, even after a mission fails.
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sim-run --scenario mission --all-missions --seeds 3
      # U-085: twenty seeds, not three: three cannot measure a completion rate, so the floors in mission.json were never
      # asserted in CI and a failing default went unseen. About five minutes.
      - run: pnpm sim-run --scenario mission --seeds 20
        if: ${{ !cancelled() }}
      - name: Qalat measured baseline at both budgets
        run: pnpm sim-run --scenario mission --mission packages/shared/src/data/missions/qalat-road.json --seeds 20
        if: ${{ !cancelled() }}
