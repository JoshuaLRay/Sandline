name: Hosted CI fallback and gated deployment

# A pull request's branch used to run this whole workflow twice for every push (once for `push`, once for
# `pull_request`), eight jobs where four do. The pull-request run is the one that counts (it tests the branch merged
# into its base), so `push` is now only main, and a newer push to the same pull request replaces the run in flight.
on:
  # Active tests run only through the private owner's reviewed-SHA controller.
  # Preserve this full hosted rollback/release path and every deployment guard.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A complete pnpm verify (typecheck, lint, and shard 1/4) still runs.
  # Remaining shards run all other test files. The stable verify gate refuses
  # skipped, missing, failed or cancelled work from ANY shard.
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mandatory pnpm verify (typecheck, lint and test shard 1/4)
        run: pnpm verify
        env:
          SANDLINE_CI_TEST_SHARD: 1/4
      - run: pnpm check:assets
      - run: pnpm check:packs

  verify-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Complete remaining Vitest files, shard ${{ matrix.shard }}
        env:
          SANDLINE_CI_TEST_SHARD: ${{ matrix.shard }}
        run: pnpm test

  verify:
    # Stable required check. "always" is essential: a failed prerequisite
    # must produce a red verify job, not a skipped (or falsely green) result.
    if: always()
    needs: [verify-core, verify-extra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful typecheck, lint, assets, packs and every test shard
        env:
          CORE_RESULT: ${{ needs['verify-core'].result }}
          EXTRA_RESULT: ${{ needs['verify-extra'].result }}
        run: |
          if [[ "$CORE_RESULT" != success || "$EXTRA_RESULT" != success ]]; then
            echo "::error::Verification failed: core=$CORE_RESULT extra-shards=$EXTRA_RESULT"
            exit 1
          fi

  # Independent reviews no longer serialize behind the Qalat road supports,
  # replacement bundle, or map-review screenshot pass.
  streaming-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      # The browser download is most of this job's time and the slowest, flakiest step in CI: cache it by Playwright's
      # version, and retry (with a time limit) the one download that stalls.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browsers' system libraries come from an Ubuntu mirror that is sometimes very slow (a package every few
      # seconds; fifteen minutes for three browsers): keep the .debs apt downloads and put them back before the install.
      - id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-streaming-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Seed apt with the cached packages
        run: |
          mkdir -p ~/apt-debs
          sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed or timed out" >&2
            # A timed-out attempt leaves its apt-get running; a retry needs the dpkg lock it holds.
            for _ in $(seq 60); do sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break; sleep 5; done
          done
          exit 1
      - name: Keep the downloaded packages
        if: always() && steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-debs
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo chown -R "$USER" ~/apt-debs
      - name: Save the downloaded packages
        if: always() && steps.debs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-streaming-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm check:packs
      - run: pnpm --filter @sandline/client build
      - run: pnpm check:load-time
      - name: Qalat Road first playable frame budget
        run: SANDLINE_LOAD_WORLD=qalat-road pnpm check:load-time
      - name: Play current isolated Qalat WIP with normal controls
        run: pnpm exec tsx packages/tools/src/check-qalat-preview.ts
      - uses: actions/upload-artifact@v4
        with:
          name: qalat-playable-wip
          path: artifacts/qalat-preview/*
          if-no-files-found: error
      - name: Capture Qalat map review
        run: pnpm exec tsx packages/tools/src/capture-map-review.ts
      - uses: actions/upload-artifact@v4
        with:
          name: qalat-map-review
          path: artifacts/map-review/*
          if-no-files-found: error
      - run: pnpm perf:frame

  streaming-captures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: insertion, artifact: qalat-insertion-review, output: qalat-insertion }
          - { target: road-supports, artifact: qalat-road-support-review, output: qalat-road-supports }
          - { target: depot, artifact: qalat-depot-review, output: qalat-depot }
          - { target: outpost, artifact: qalat-outpost-review, output: qalat-outpost }
          - { target: replacement, artifact: qalat-replacement-review, output: qalat-replacement }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      # The browser download is most of this job's time and the slowest, flakiest step in CI: cache it by Playwright's
      # version, and retry (with a time limit) the one download that stalls.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browsers' system libraries come from an Ubuntu mirror that is sometimes very slow (a package every few
      # seconds; fifteen minutes for three browsers): keep the .debs apt downloads and put them back before the install.
      - id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-streaming-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Seed apt with the cached packages
        run: |
          mkdir -p ~/apt-debs
          sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed or timed out" >&2
            # A timed-out attempt leaves its apt-get running; a retry needs the dpkg lock it holds.
            for _ in $(seq 60); do sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break; sleep 5; done
          done
          exit 1
      - name: Keep the downloaded packages
        if: always() && steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-debs
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo chown -R "$USER" ~/apt-debs
      - name: Save the downloaded packages
        if: always() && steps.debs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-streaming-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Every matrix member starts from the same commit, generates its OWN
      # immutable review inputs, uploads its OWN evidence, and fails closed.
      - run: pnpm --filter @sandline/client build
      - name: Generate and capture ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            insertion)
              pnpm gen:qalat-insertion
              pnpm exec tsx packages/tools/src/capture-qalat-insertion.ts ;;
            road-supports)
              pnpm gen:qalat-road-supports
              pnpm exec tsx packages/tools/src/capture-qalat-road-supports.ts ;;
            depot)
              pnpm gen:qalat-depot
              pnpm exec tsx packages/tools/src/capture-qalat-depot.ts ;;
            outpost)
              pnpm gen:qalat-outpost
              pnpm exec tsx packages/tools/src/capture-qalat-outpost.ts ;;
            replacement)
              pnpm gen:qalat-replacement
              pnpm gen:qalat-replacement --check
              pnpm exec tsx packages/tools/src/capture-qalat-outpost.ts --replacement ;;
            *)
              echo "::error::Unknown capture target"
              exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.output }}/*
          if-no-files-found: error

  streaming:
    if: always()
    needs: [streaming-core, streaming-captures]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require load, visual, gameplay and ALL five captured review suites
        env:
          CORE_RESULT: ${{ needs['streaming-core'].result }}
          CAPTURE_RESULT: ${{ needs['streaming-captures'].result }}
        run: |
          if [[ "$CORE_RESULT" != success || "$CAPTURE_RESULT" != success ]]; then
            echo "::error::Streaming failed: core=$CORE_RESULT captures=$CAPTURE_RESULT"
            exit 1
          fi

  # ADR-014: the transcendental-drift bug is invisible on a V8-to-V8 pairing.
  # Node and Chrome are both V8, so parity MUST also run on a non-V8 engine or
  # nothing in this project can detect it.
  parity-non-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json's `packageManager` field is
      # the single source of truth; specifying both makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium for T-3.01's navmesh run; the ADR-014 parity project still
      # runs on Firefox and WebKit only.
      #
      # Three browsers downloaded and their system libraries installed, every run, took 6 minutes to over half an hour
      # (the parity test itself takes 15 seconds), and sometimes stalled for good. The browsers are cached by
      # Playwright's version, and the install is retried with a time limit.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-parity-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browsers' system libraries come from an Ubuntu mirror that is sometimes very slow (a package every few
      # seconds; fifteen minutes for three browsers): keep the .debs apt downloads and put them back before the install.
      - id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-parity-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Seed apt with the cached packages
        run: |
          mkdir -p ~/apt-debs
          sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
      - name: Install browsers
        run: |
          for attempt in 1 2 3; do
            timeout 300 pnpm exec playwright install --with-deps chromium firefox webkit && exit 0
            echo "playwright install attempt $attempt failed or timed out" >&2
            # A timed-out attempt leaves its apt-get running; a retry needs the dpkg lock it holds.
            for _ in $(seq 60); do sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break; sleep 5; done
          done
          exit 1
      - name: Keep the downloaded packages
        if: always() && steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-debs
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo chown -R "$USER" ~/apt-debs
      - name: Save the downloaded packages
        if: always() && steps.debs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-parity-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm test:parity-browsers

  # T-4.17: discover every committed mission file; three seeds at both budgets.
  # Each mission completes at least once, or reports why (gameplay losses are
  # diagnostic; invalid files and runner errors fail). See known balance bug B-11.
  # Keep T-3.35's combat/AI-cost gate as a separate step, even after a mission fails.
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sim-run --scenario mission --all-missions --seeds 3
      # U-085: twenty seeds, not three: three cannot measure a completion rate, so the floors in mission.json were never
      # asserted in CI and a failing default went unseen. About five minutes.
      - run: pnpm sim-run --scenario mission --seeds 20
        if: ${{ !cancelled() }}
      - name: Qalat measured baseline at both budgets
        run: pnpm sim-run --scenario mission --mission packages/shared/src/data/missions/qalat-road.json --seeds 20
        if: ${{ !cancelled() }}

  # Production static Worker release. The four required jobs must all pass
  # on this main commit before GitHub Actions can deploy. PRs never deploy.
  # Enable only after setting the scoped Cloudflare Worker token, account ID
  # and SANDLINE_HOST variable, and disabling competing Cloudflare Git builds.
  deploy-worker:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.CLOUDFLARE_WORKER_DEPLOY_ENABLED == 'true'
    needs: [verify, streaming, parity-non-v8, mission]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Reject stale main and missing configuration
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SANDLINE_HOST: ${{ vars.SANDLINE_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT" ]]; then
            echo "::error::Worker deployment is enabled but CLOUDFLARE_WORKERS_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unset"
            exit 1
          fi
          if [[ ! "$SANDLINE_HOST" =~ ^wss://[^[:space:]]+$ ]]; then
            echo "::error::SANDLINE_HOST must be the production wss:// Fly host"
            exit 1
          fi
          git fetch --depth=1 origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced after this CI run began; refusing to overwrite a newer production release"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production browser client
        run: pnpm --filter @sandline/client build
        env:
          SANDLINE_HOST: ${{ vars.SANDLINE_HOST }}
      - name: Validate Worker static assets
        shell: bash
        run: |
          set -euo pipefail
          test -s packages/client/dist/index.html
          files="$(find packages/client/dist -type f | wc -l)"
          if (( files > 20000 )); then
            echo "::error::Static asset count too high: $files"
            exit 1
          fi
          large="$(find packages/client/dist -type f -size +25600k -print -quit)"
          if [[ -n "$large" ]]; then
            echo "::error::Static asset exceeds 25 MiB: $large"
            exit 1
          fi
          echo "Validated $files static files for sandline Worker"
      - name: Publish verified client to Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --assets ./packages/client/dist --name sandline --compatibility-date 2026-10-12
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
