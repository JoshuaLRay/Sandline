name: Mark T4.15 complete
on:
  push:
    branches: [task/t-4.15-scripted-events]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update task documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TASKS.md'); s=p.read_text(); old='| T-4.15 | OPEN | T-4.14 |'; new='| T-4.15 | DONE | T-4.14 |'
          if old not in s: raise SystemExit('TASKS row not found')
          p.write_text(s.replace(old,new,1))
          p=Path('PLAN.md'); s=p.read_text()
          anchor="""- **Size:** M\n\n##### T-4.16 — Checkpoints, failure and retry"""
          note="""- **Size:** M\n- **Completed 2026-09-24.** Mission events are typed and validated in `shared/src/sim/events.ts` and executed deterministically by `server/src/session/events.ts`. Existing encounter triggers now enter through the same runner; objective start/complete, area entry, time, group-dead and flag triggers drive spawn-group, objective jump, blocker, message/callout and flag actions. Dynamic blocker boxes are authoritative collision and shot geometry, flag matching Detour polygons without a rebake, replicate in protocol 26, and are used by client prediction, effects, camera collision and rendering. Session/protocol/nav regressions cover every trigger/action and blocker movement, shot and pathing behavior.\n\n##### T-4.16 — Checkpoints, failure and retry"""
          if anchor not in s: raise SystemExit('PLAN T-4.15 anchor not found')
          p.write_text(s.replace(anchor,note,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TASKS.md PLAN.md
          git commit -m "docs(T-4.15): mark scripted events complete"
          git push origin HEAD:task/t-4.15-scripted-events
