# Deploy the session host (T-1.5.07).
#
# Runs on demand, and on a push to main that touches the host's code. It does
# nothing without a FLY_API_TOKEN secret, so a fork or a fresh clone does not
# fail CI for lack of an account: the job is skipped, with a notice saying so.
#
# With the secrets set, this is the WHOLE deploy: it creates the Fly app named
# in fly.toml if it does not exist yet, deploys, writes the host's address into
# the SANDLINE_HOST repository variable, and rebuilds Pages so the published
# lobby points at it. Two secrets are the only setup — docs/DEPLOYING.md:
#   FLY_API_TOKEN  an org-scoped Fly token
#   GH_PAT         a GitHub token that may write repository variables. The
#                  workflow's own GITHUB_TOKEN cannot: setting a variable with
#                  it fails with "Resource not accessible by integration"
#                  (run #4), whatever `permissions:` grants it.
name: Host

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'packages/server/Dockerfile'
      - 'fly.toml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/host.yml'

concurrency:
  group: host
  cancel-in-progress: false

# `actions: write` is what lets the job set the SANDLINE_HOST variable and
# dispatch the Pages workflow; nothing here writes to the repository's content.
permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for a deploy token
        id: token
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::FLY_API_TOKEN is not set; skipping the host deploy. See docs/DEPLOYING.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          # Fail here, before a deploy, rather than after one with a 403 at the
          # last step and a host nobody is pointed at.
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ] && [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "::error::GH_PAT is not set. The workflow needs it to write SANDLINE_HOST; see docs/DEPLOYING.md."
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'
      - name: Create the app if it does not exist yet
        if: steps.token.outputs.present == 'true'
        run: |
          app="$(sed -nE 's/^app *= *"([^"]+)".*/\1/p' fly.toml)"
          if flyctl status --app "$app" >/dev/null 2>&1; then
            echo "app $app exists"
          else
            # App names are global on Fly. If this fails with "already taken",
            # change `app` in fly.toml and run again.
            flyctl apps create "$app"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health check
        if: steps.token.outputs.present == 'true'
        id: health
        run: |
          host="$(flyctl status --json | jq -r '.Hostname')"
          echo "host: $host"
          curl --fail --silent --show-error "https://$host/healthz"
          echo "host=$host" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The published client learns the address from the SANDLINE_HOST
      # repository variable at build time (pages.yml). Setting it here, from the
      # hostname Fly actually assigned, means the variable can never name a host
      # that does not exist — and rebuilding Pages means the lobby shows it
      # within a few minutes of this job finishing.
      - name: Point the published client at the host
        if: steps.token.outputs.present == 'true'
        run: |
          gh variable set SANDLINE_HOST --body "wss://${{ steps.health.outputs.host }}"
          gh workflow run pages.yml --ref main
          echo "::notice::SANDLINE_HOST=wss://${{ steps.health.outputs.host }}; Pages rebuild dispatched."
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
