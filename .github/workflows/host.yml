# Deploy the session host (T-1.5.07).
#
# Runs on demand, and on a push to main that touches the host's code. It does
# nothing without a FLY_API_TOKEN secret, so a fork or a fresh clone does not
# fail CI for lack of an account: the job is skipped, with a notice saying so.
#
# Setup, once, is in docs/DEPLOYING.md — create the app, set the secret, set the
# SANDLINE_HOST repository variable so the published client points here.
name: Host

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'packages/server/Dockerfile'
      - 'fly.toml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/host.yml'

concurrency:
  group: host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for a deploy token
        id: token
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::FLY_API_TOKEN is not set; skipping the host deploy. See docs/DEPLOYING.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health check
        if: steps.token.outputs.present == 'true'
        run: |
          host="$(flyctl status --json | jq -r '.Hostname')"
          echo "host: $host"
          curl --fail --silent --show-error "https://$host/healthz"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
