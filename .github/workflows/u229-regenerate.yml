# Short-lived branch-only capture proof synchronization after U-229 geometry repair.
# REMOVE this workflow before final PR review/merge. No production or release jobs.
name: U-229 sync regenerated visual proof
on:
  push:
    branches: [task/U-229-qalat-supply-caches]
permissions:
  contents: write
  actions: read
jobs:
  sync-evidence:
    if: github.repository == 'JoshuaLRay/Sandline' && github.ref == 'refs/heads/task/U-229-qalat-supply-caches'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve regenerated capture proofs for the exact source checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh refuses extracting into a directory containing tracked images.
          # Download into clean per-artifact directories first, then overwrite
          # only artifacts emitted by the exact geometry revision's green capture jobs.
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for item in \
            qalat-road-support-review:qalat-road-supports \
            qalat-depot-review:qalat-depot \
            qalat-outpost-review:qalat-outpost \
            qalat-replacement-review:qalat-replacement; do
            name="${item%%:*}"
            target="${item#*:}"
            mkdir -p "$tmp/$target" "artifacts/$target"
            gh run download 39148011976 --repo JoshuaLRay/Sandline --name "$name" --dir "$tmp/$target"
            cp -f "$tmp/$target"/. "artifacts/$target"/
          done
      - name: Persist exact reviewed proof only to the U-229 branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/task/U-229-qalat-supply-caches
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u artifacts/qalat-road-supports artifacts/qalat-depot artifacts/qalat-outpost artifacts/qalat-replacement
          if git diff --cached --quiet; then
            echo "All visual proof was already checked in"
            exit 0
          fi
          git commit -m "U-229: synchronize verified geometry screenshots and capture digests"
          git push origin HEAD:refs/heads/task/U-229-qalat-supply-caches
